<head>

    <!-- Favicon (inline emoji) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😏</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #1a0533, #2d1b69, #0f3460, #1a3c40);
            background-size: 400% 400%;
            animation: bgShift 12s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #f0ece4;
            position: relative;
        }

        @keyframes bgShift {
            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 100% 50%;
            }

            50% {
                background-position: 100% 0%;
            }

            75% {
                background-position: 0% 100%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* ========== COLOUR BLOBS ========== */
        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: #ff3a6c;
            top: -10%;
            left: -5%;
            animation: blobFloat1 10s ease-in-out infinite alternate;
        }

        .blob-2 {
            width: 450px;
            height: 450px;
            background: #a855f7;
            top: 50%;
            right: -8%;
            animation: blobFloat2 12s ease-in-out infinite alternate;
        }

        .blob-3 {
            width: 400px;
            height: 400px;
            background: #06b6d4;
            bottom: -10%;
            left: 30%;
            animation: blobFloat3 9s ease-in-out infinite alternate;
        }

        .blob-4 {
            width: 350px;
            height: 350px;
            background: #f59e0b;
            top: 20%;
            right: 30%;
            animation: blobFloat4 11s ease-in-out infinite alternate;
        }

        .blob-5 {
            width: 300px;
            height: 300px;
            background: #22c55e;
            bottom: 20%;
            left: -5%;
            animation: blobFloat1 14s 2s ease-in-out infinite alternate;
        }

        @keyframes blobFloat1 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(60px, 40px) scale(1.15);
            }
        }

        @keyframes blobFloat2 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(-50px, -60px) scale(1.2);
            }
        }

        @keyframes blobFloat3 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(40px, -50px) scale(1.1);
            }
        }

        @keyframes blobFloat4 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(-30px, 30px) scale(1.25);
            }
        }

        /* ========== FLOATING EMOJI RAIN ========== */
        .emoji-rain {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .emoji {
            position: absolute;
            font-size: 1.6rem;
            top: -50px;
            animation: emojiDrop linear infinite;
            opacity: 0.35;
            filter: blur(0.5px);
        }

        @keyframes emojiDrop {
            0% {
                transform: translateY(-60px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.35;
            }

            90% {
                opacity: 0.25;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* ========== DOODLE CANVAS ========== */
        .doodles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .doodle {
            position: absolute;
            opacity: 0;
            animation: doodleFadeIn 1.2s ease forwards;
        }

        .doodle-1 {
            top: 5%;
            left: 3%;
            animation-delay: 0.3s;
        }

        .doodle-2 {
            top: 10%;
            right: 5%;
            animation-delay: 0.6s;
        }

        .doodle-3 {
            top: 50%;
            left: 2%;
            animation-delay: 0.8s;
        }

        .doodle-4 {
            bottom: 6%;
            right: 4%;
            animation-delay: 1.0s;
        }

        .doodle-5 {
            top: 28%;
            left: 5%;
            animation-delay: 1.2s;
        }

        .doodle-6 {
            bottom: 22%;
            left: 7%;
            animation-delay: 0.5s;
        }

        .doodle-7 {
            top: 6%;
            left: 28%;
            animation-delay: 1.4s;
        }

        .doodle-8 {
            bottom: 4%;
            left: 28%;
            animation-delay: 0.9s;
        }

        .doodle-9 {
            top: 38%;
            right: 3%;
            animation-delay: 1.1s;
        }

        .doodle-10 {
            bottom: 12%;
            right: 22%;
            animation-delay: 1.5s;
        }

        .doodle-11 {
            top: 15%;
            left: 14%;
            animation-delay: 0.4s;
        }

        .doodle-12 {
            bottom: 32%;
            right: 6%;
            animation-delay: 1.3s;
        }

        .doodle-13 {
            top: 3%;
            right: 26%;
            animation-delay: 0.7s;
        }

        .doodle-14 {
            bottom: 3%;
            left: 10%;
            animation-delay: 1.6s;
        }

        .doodle-15 {
            top: 68%;
            right: 10%;
            animation-delay: 0.2s;
        }

        .doodle-16 {
            top: 22%;
            right: 16%;
            animation-delay: 1.8s;
        }

        .float-1 {
            animation: doodleFadeIn 1.2s ease forwards, floatUpDown 4s 1.5s ease-in-out infinite;
        }

        .float-2 {
            animation: doodleFadeIn 1.2s ease forwards, floatRotate 5s 1.5s ease-in-out infinite;
        }

        .float-3 {
            animation: doodleFadeIn 1.2s ease forwards, floatSway 3.5s 1.5s ease-in-out infinite;
        }

        .float-4 {
            animation: doodleFadeIn 1.2s ease forwards, floatPulse 3s 1.5s ease-in-out infinite;
        }

        @keyframes doodleFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-15deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes floatUpDown {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes floatRotate {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(10deg);
            }
        }

        @keyframes floatSway {

            0%,
            100% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(10px);
            }
        }

        @keyframes floatPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        /* ========== MEME CARD ========== */
        .card {
            position: relative;
            z-index: 1;
            max-width: 540px;
            width: 92vw;
            border: 2px solid transparent;
            border-radius: 24px;
            padding: 38px 28px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            background:
                linear-gradient(135deg, rgba(18, 18, 30, 0.85), rgba(10, 10, 20, 0.88)) padding-box,
                linear-gradient(135deg, #ff3a6c, #a855f7, #3b82f6, #ff3a6c) border-box;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background-size: 100% 100%, 300% 300%;
            animation: cardEntry 0.9s cubic-bezier(.16, 1, .3, 1) both,
                borderGlow 4s ease-in-out infinite;
            box-shadow:
                0 0 40px rgba(168, 85, 247, 0.15),
                0 0 80px rgba(255, 58, 108, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(.25, .8, .25, 1),
                box-shadow 0.4s cubic-bezier(.25, .8, .25, 1);
        }

        @keyframes borderGlow {

            0%,
            100% {
                background-position: 100% 100%, 0% 50%;
            }

            50% {
                background-position: 100% 100%, 100% 50%;
            }
        }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow:
                0 0 60px rgba(168, 85, 247, 0.25),
                0 0 100px rgba(255, 58, 108, 0.12),
                0 30px 70px rgba(0, 0, 0, 0.55);
        }

        @keyframes cardEntry {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.94);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ========== TOP TEXT ========== */
        .top-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: clamp(1.6rem, 5vw, 2.6rem);
            text-align: center;
            line-height: 1.2;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ff6b9d, #ffd93d, #ff6b9d);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textFade 1s 0.3s cubic-bezier(.16, 1, .3, 1) both,
                textShine 3s ease-in-out infinite;
            filter: drop-shadow(0 2px 8px rgba(255, 107, 157, 0.3));
        }

        @keyframes textShine {

            0%,
            100% {
                background-position: 0% center;
            }

            50% {
                background-position: 200% center;
            }
        }

        /* ========== IMAGE ========== */
        .meme-img-wrapper {
            width: 80%;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            animation: imgFade 1s 0.5s cubic-bezier(.16, 1, .3, 1) both;
            transition: transform 0.4s cubic-bezier(.25, .8, .25, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .meme-img-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .meme-img-wrapper:hover {
            transform: scale(1.04) rotate(-1deg);
        }

        .meme-img-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            filter: contrast(1.08) saturate(0.9);
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .meme-img-wrapper:hover img {
            filter: contrast(1.15) saturate(1.1);
            transform: scale(1.02);
        }

        /* ========== BOTTOM TEXT ========== */
        .bottom-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: clamp(1.2rem, 3.8vw, 1.7rem);
            letter-spacing: 0px;
            text-align: center;
            line-height: 1.3;
            background: linear-gradient(135deg, #c084fc, #67e8f9, #c084fc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textFade 1s 0.7s cubic-bezier(.16, 1, .3, 1) both,
                textShine 4s 1s ease-in-out infinite;
            filter: drop-shadow(0 2px 6px rgba(192, 132, 252, 0.25));
        }

        .rose {
            -webkit-text-fill-color: initial;
            display: inline-block;
            animation: roseDrop 2s 1.5s ease both;
        }

        /* ========== FUNNY LINE ========== */
        .funny-line {
            text-align: center;
            animation: textFade 1s 1s cubic-bezier(.16, 1, .3, 1) both;
            position: relative;
            min-height: 2.2em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .funny-line .line {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: clamp(0.85rem, 2.5vw, 1.05rem);
            color: rgba(255, 255, 255, 0.55);
            position: absolute;
            white-space: nowrap;
            animation: lineRotate 12s ease-in-out infinite;
            opacity: 0;
        }

        .funny-line .line:nth-child(1) {
            animation-delay: 0s;
        }

        .funny-line .line:nth-child(2) {
            animation-delay: 3s;
        }

        .funny-line .line:nth-child(3) {
            animation-delay: 6s;
        }

        .funny-line .line:nth-child(4) {
            animation-delay: 9s;
        }

        @keyframes lineRotate {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            4%,
            21% {
                opacity: 1;
                transform: translateY(0);
            }

            25%,
            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        /* ========== COMMON ANIMATIONS ========== */
        @keyframes textFade {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes imgFade {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes roseDrop {
            0% {
                opacity: 0;
                transform: translateY(-20px) rotate(-30deg);
            }

            60% {
                opacity: 1;
                transform: translateY(3px) rotate(5deg);
            }

            100% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
        }

        /* ========== MOBILE ========== */
        @media (max-width: 480px) {
            .card {
                padding: 24px 16px 20px;
                gap: 14px;
                border-radius: 18px;
            }

            .meme-img-wrapper {
                width: 90%;
            }

            .doodle svg {
                transform: scale(0.65);
            }

            .emoji {
                font-size: 1.2rem;
            }
        }

        @media (min-width: 768px) {
            .card {
                padding: 44px 36px 34px;
            }
        }
    </style>
</head>

<body>

    <!-- ========== COLOUR BLOBS BG ========== -->
    <div class="bg-gradient">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="blob blob-5"></div>
    </div>

    <!-- ========== EMOJI RAIN ========== -->
    <div class="emoji-rain" id="emojiRain"></div>

    <!-- ========== DOODLES ========== -->
    <div class="doodles">
        <!-- Question mark — yellow -->
        <div class="doodle doodle-1 float-1">
            <svg width="44" height="58" viewBox="0 0 44 58" fill="none">
                <path d="M12 8C12 8 14 3 22 3C30 3 33 8 33 14C33 20 27 22 22 26C20 28 20 32 20 34"
                    stroke="rgba(255,220,80,0.3)" stroke-width="2.5" stroke-linecap="round" />
                <circle cx="20" cy="44" r="3" fill="rgba(255,220,80,0.3)" />
            </svg>
        </div>

        <!-- Star — pink -->
        <div class="doodle doodle-2 float-2">
            <svg width="42" height="42" viewBox="0 0 40 40" fill="none">
                <path d="M20 2L24 14L36 14L26 22L30 34L20 26L10 34L14 22L4 14L16 14Z" stroke="rgba(255,100,150,0.28)"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>

        <!-- Curly arrow — cyan -->
        <div class="doodle doodle-3 float-3">
            <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
                <path d="M5 40C10 30 15 20 25 15C35 10 45 15 40 25" stroke="rgba(100,230,255,0.22)" stroke-width="2"
                    stroke-linecap="round" />
                <path d="M36 20L40 25L34 27" stroke="rgba(100,230,255,0.22)" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </div>

        <!-- Exclamation marks — red -->
        <div class="doodle doodle-4 float-4">
            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                <path d="M10 5L10 30" stroke="rgba(255,100,100,0.3)" stroke-width="3" stroke-linecap="round" />
                <circle cx="10" cy="40" r="3" fill="rgba(255,100,100,0.3)" />
                <path d="M22 8L22 28" stroke="rgba(255,100,100,0.22)" stroke-width="2.5" stroke-linecap="round" />
                <circle cx="22" cy="36" r="2.5" fill="rgba(255,100,100,0.22)" />

        <!-- Lightning bolt — yellow -->

            <svg width="35" height="55" viewBox="0 0 35 55" fill="none">

                    stroke-linejoin="round" />
            </svg>
        </div>

        <!-- Circle scribble — blue -->
        <div class="doodle doodle-6 float-1">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <ellipse cx="24" cy="24" rx="18" ry="16" stroke="rgba(130,180,255,0.2)" stroke-width="2"
                    stroke-linecap="round" stroke-dasharray="4 6" />
                <ellipse cx="24" cy="24" rx="14" ry="20" stroke="rgba(130,180,255,0.14)" stroke-width="1.5"
                    stroke-linecap="round" stroke-dasharray="3 5" transform="rotate(30 24 24)" />
            </svg>
        </div>

        <!-- Diamond cluster — orange -->
        <div class="doodle doodle-7 float-3">
            <svg width="60" height="30" viewBox="0 0 60 30" fill="none">
                <path d="M10 15L12 10L14 15L12 20Z" fill="rgba(255,180,60,0.2)" />
                <path d="M28 10L30 5L32 10L30 15Z" fill="rgba(255,180,60,0.16)" />
                <path d="M48 12L50 7L52 12L50 17Z" fill="rgba(255,180,60,0.22)" />
            </svg>
        </div>

        <!-- Spiral — purple -->
        <div class="doodle doodle-8 float-4">
            <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
                <path
                    d="M25 25C25 22 28 20 30 22C32 24 30 28 26 28C22 28 20 24 20 20C20 16 24 12 30 12C36 12 40 18 40 25"
                    stroke="rgba(200,130,255,0.22)" stroke-width="2" stroke-linecap="round" />
            </svg>
        </div>

        <!-- Squiggly — green -->
        <div class="doodle doodle-9 float-1">
            <svg width="55" height="20" viewBox="0 0 55 20" fill="none">
                <path d="M3 10C8 4 13 16 18 10C23 4 28 16 33 10C38 4 43 16 48 10" stroke="rgba(100,255,180,0.2)"
                    stroke-width="2" stroke-linecap="round" />
            </svg>
        </div>

        <!-- LOL text — pink -->
        <div class="doodle doodle-10 float-2">
            <svg width="55" height="28" viewBox="0 0 55 28" fill="none">
                <text x="5" y="22" font-family="Permanent Marker, cursive" font-size="22" fill="rgba(255,120,180,0.2)"
                    font-weight="700">LOL</text>
            </svg>
        </div>

        <!-- Heart — red/pink -->
        <div class="doodle doodle-11 float-4">
            <svg width="32" height="30" viewBox="0 0 32 30" fill="none">
                <path
                    d="M16 28C16 28 2 18 2 10C2 5 6 2 10 2C13 2 15 4 16 6C17 4 19 2 22 2C26 2 30 5 30 10C30 18 16 28 16 28Z"
                    stroke="rgba(255,80,120,0.28)" stroke-width="2" stroke-linecap="round"
                    fill="rgba(255,80,120,0.06)" />
            </svg>
        </div>

        <!-- X marks — orange -->
        <div class="doodle doodle-12 float-3">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path d="M5 5L23 23M23 5L5 23" stroke="rgba(255,160,60,0.22)" stroke-width="2.5"
                    stroke-linecap="round" />
            </svg>
        </div>

        <!-- Thought bubbles — cyan -->
        <div class="doodle doodle-13 float-1">
            <svg width="50" height="25" viewBox="0 0 50 25" fill="none">
                <circle cx="10" cy="18" r="4" fill="rgba(100,220,255,0.14)" />
                <circle cx="24" cy="12" r="6" fill="rgba(100,220,255,0.10)" />
                <circle cx="40" cy="8" r="8" fill="rgba(100,220,255,0.08)" />
            </svg>
        </div>

        <!-- Arrow — warm -->
        <div class="doodle doodle-14 float-2">
            <svg width="50" height="30" viewBox="0 0 50 30" fill="none">
                <path d="M5 15H40" stroke="rgba(255,200,100,0.22)" stroke-width="2" stroke-linecap="round" />
                <path d="M35 8L42 15L35 22" stroke="rgba(255,200,100,0.22)" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </div>

        <!-- Wavy — green -->
        <div class="doodle doodle-15 float-3">

                <path d="M3 20C10 5 20 20 30 8C40 -4 50 20 57 10" stroke="rgba(100,255,160,0.18)" stroke-width="2"
                    stroke-linecap="round" />

        <div class="doodle doodle-16 float-4">

                <circle cx="20" cy="20" r="16" stroke="rgba(255,220,80,0.2)" stroke-width="1.5" />
                <circle cx="14" cy="16" r="2" fill="rgba(255,220,80,0.2)" />
                <circle cx="26" cy="16" r="2" fill="rgba(255,220,80,0.2)" />

    <!-- ========== MEME CARD ========== -->

            <img src="meme.jpg" alt="Meme face" loading="eager">

            Aur Google me placement chahiye tuze <span class="rose">🥀</span>
        </p>

        <!-- Funny rotating lines -->
        <div class="funny-line">
            <span class="line">💀 Resume me likha — "Quick Learner" 💀</span>
            <span class="line">🤡 College fest organize kiya, Google samjhe 🤡</span>
            <span class="line">😭 LinkedIn pe "Open to Work" lagaya tier-3 se 😭</span>
            <span class="line">🗿 CGPA 6.5 — "Sir passion hai coding ka" 🗿</span>
        </div>
    </div>

    <!-- ========== EMOJI RAIN JS ========== -->
    <script>
        (function () {
            const emojis = ['💀', '😏', '🤡', '🥀', '😂', '🔥', '💅', '👀', '🫠', '😭', '🗿', '⚡'];
            const container = document.getElementById('emojiRain');

            function spawnEmoji() {
                const el = document.createElement('span');
                el.className = 'emoji';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.animationDuration = (6 + Math.random() * 8) + 's';
                el.style.animationDelay = Math.random() * 2 + 's';
                el.style.fontSize = (1 + Math.random() * 1) + 'rem';
                el.style.opacity = 0.15 + Math.random() * 0.2;
                container.appendChild(el);

                el.addEventListener('animationend', () => el.remove());
            }

            // Initial burst
            for (let i = 0; i < 12; i++) {
                setTimeout(spawnEmoji, i * 300);
            }

            // Continuous gentle rain
            setInterval(spawnEmoji, 1200);
        })();
    </script>
